name: Elixir CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # The beaver ref to test against; set BEAVER_REF as a repository variable
  # while a stacked beaver PR is in flight, then unset it after merging.
  BEAVER_REF: ${{ vars.BEAVER_REF || 'main' }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Warn about stacked Beaver ref drift
        if: github.event_name == 'pull_request' && env.BEAVER_REF == 'main'
        run: |
          echo "::warning title=BEAVER_REF defaulting to main::If this PR depends on an unmerged beaver branch, set repository variable BEAVER_REF before opening or updating the PR to avoid silently testing against main."

      - name: Checkout beaver and kinda
        run: |
          git clone --depth 1 --branch "$BEAVER_REF" https://github.com/beaver-lodge/beaver.git
          git clone --depth 1 https://github.com/beaver-lodge/kinda.git
          echo "Resolved BEAVER_REF=$BEAVER_REF at commit $(git -C beaver rev-parse --short HEAD)"

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install prebuilt LLVM/MLIR
        run: bash beaver/scripts/install-prebuilt-llvm.sh llvm-prebuilt
        env:
          LLVM_EUDSL_ASSET_REVISION: latest

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Build Hex package
        # Simulate publishing: declare deps as Hex constraints (no path
        # overrides) and reuse the test-env build so the tarball is produced
        # without another native build.
        run: |
          env -u BEAVER_PATH -u BEAVER_KINDA_PATH MIX_ENV=test mix hex.build
