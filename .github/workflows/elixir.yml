name: Elixir CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # The beaver ref to test against; set BEAVER_REF as a repository variable
  # while a stacked beaver PR is in flight, then unset it after merging. The
  # ref is resolved at runtime and falls back to main if it no longer exists.
  BEAVER_REF: ${{ vars.BEAVER_REF || 'main' }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve beaver ref
        id: beaver_ref
        run: |
          candidate="${{ env.BEAVER_REF }}"
          if git ls-remote --exit-code --heads \
            https://github.com/beaver-lodge/beaver.git "refs/heads/${candidate}" \
            >/dev/null 2>&1; then
            echo "beaver_ref=${candidate}" >> "$GITHUB_OUTPUT"
          else
            echo "warning: beaver branch ${candidate} not found, falling back to main" >> "$GITHUB_STEP_SUMMARY"
            echo "beaver_ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout beaver
        run: |
          git clone --depth 1 --branch "${{ steps.beaver_ref.outputs.beaver_ref }}" https://github.com/beaver-lodge/beaver.git

      - name: Checkout kinda
        run: |
          git clone https://github.com/beaver-lodge/kinda.git
          ref="$(awk 'NF && $1 !~ /^#/ {print $1; exit}' beaver/kinda.ref 2>/dev/null || true)"
          if [ -n "$ref" ] && git -C kinda cat-file -e "$ref^{commit}" 2>/dev/null; then
            git -C kinda checkout -q "$ref"
          elif [ -n "$ref" ]; then
            echo "warning: paired kinda ref $ref unavailable, using main" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install prebuilt LLVM/MLIR
        run: bash beaver/scripts/install-prebuilt-llvm.sh llvm-prebuilt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_REVISION: latest

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Run Credo
        run: mix credo --strict
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Run tests
        run: mix test --warnings-as-errors
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Run fixed runtime soak gate
        run: bash scripts/runtime-soak.sh _build/runtime_soak 1 0x6101

      - name: Upload runtime soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-soak-report
          path: _build/runtime_soak
          if-no-files-found: error

      - name: Checkout pinned Jason probe corpus
        uses: actions/checkout@v4
        with:
          repository: michalmuskala/jason
          ref: 4ede42858eb19f80ec9e863aab52df466eab8608
          path: jason-probe-source

      - name: Run Jason compile probe
        run: |
          mix batata.jason_probe \
            --source jason-probe-source \
            --output _build/jason_probe/report.json \
            --baseline probe/jason/baseline.json \
            --fail-on-regression
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Upload Jason probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jason-probe-report
          path: _build/jason_probe/report.json
          if-no-files-found: error

      - name: Checkout pinned Decimal probe corpus
        uses: actions/checkout@v4
        with:
          repository: ericmj/decimal
          ref: 592d59ac4474933f91cdc3e8e037f137f7e008b0
          path: decimal-probe-source

      - name: Run Decimal compile probe
        run: |
          mix batata.decimal_probe \
            --source decimal-probe-source \
            --output _build/decimal_probe/report.json \
            --baseline probe/decimal/baseline.json
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Upload Decimal probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decimal-probe-report
          path: _build/decimal_probe/report.json
          if-no-files-found: error

      - name: Run process-reuse benchmark
        # The slot-recycling benchmark (#50 stage 1) must keep producing a
        # full-success result under the small table and a failing baseline
        # without recycling; the JSON assertions guard against regressions.
        run: |
          output="$(zig run -O ReleaseFast --dep runtime \
            -Mroot=bench/process_reuse.zig -Mruntime=native/term_runtime.zig -lc 2>&1)"
          echo "$output"
          echo "$output" | grep -q '"reuse_success": 1000000'
          echo "$output" | grep -q '"reuse_last_index": [0-9]'
          echo "$output" | grep -q '"no_reuse_last_index": 1000000'

      - name: Build Hex package
        # Simulate publishing: declare deps as Hex constraints (no path
        # overrides) and reuse the test-env build so the tarball is produced
        # without another native build.
        run: |
          env -u BEAVER_PATH -u BEAVER_KINDA_PATH MIX_ENV=test mix hex.build
