name: Elixir CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # The beaver ref to test against; set BEAVER_REF as a repository variable
  # while a stacked beaver PR is in flight, then unset it after merging. The
  # ref is resolved at runtime and falls back to main if it no longer exists.
  BEAVER_REF: ${{ vars.BEAVER_REF || 'main' }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve beaver ref
        id: beaver_ref
        run: |
          candidate="${{ env.BEAVER_REF }}"
          if git ls-remote --exit-code --heads \
            https://github.com/beaver-lodge/beaver.git "refs/heads/${candidate}" \
            >/dev/null 2>&1; then
            echo "beaver_ref=${candidate}" >> "$GITHUB_OUTPUT"
          else
            echo "warning: beaver branch ${candidate} not found, falling back to main" >> "$GITHUB_STEP_SUMMARY"
            echo "beaver_ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout beaver and kinda
        run: |
          git clone --depth 1 --branch "${{ steps.beaver_ref.outputs.beaver_ref }}" https://github.com/beaver-lodge/beaver.git
          git clone --depth 1 https://github.com/beaver-lodge/kinda.git

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install prebuilt LLVM/MLIR
        run: bash beaver/scripts/install-prebuilt-llvm.sh llvm-prebuilt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLVM_EUDSL_ASSET_REVISION: latest

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config

      - name: Build Hex package
        # Simulate publishing: declare deps as Hex constraints (no path
        # overrides) and reuse the test-env build so the tarball is produced
        # without another native build.
        run: |
          env -u BEAVER_PATH -u BEAVER_KINDA_PATH MIX_ENV=test mix hex.build
