name: Elixir CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pin beaver to 55064c52 (#495): beaver main's partitioned native build is
  # broken on Linux (undefined symbol: beaverContextAddWork in the partition
  # libraries). Unpin once beaver-lodge/beaver main CI is green again.
  BEAVER_REF: 55064c52

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout beaver and kinda
        run: |
          curl -fsSL https://github.com/beaver-lodge/beaver/archive/${{ env.BEAVER_REF }}.tar.gz | tar -xz
          mv beaver-* beaver
          git clone --depth 1 https://github.com/beaver-lodge/kinda.git

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install prebuilt LLVM/MLIR
        run: bash beaver/scripts/install-prebuilt-llvm.sh llvm-prebuilt
        env:
          LLVM_EUDSL_ASSET_REVISION: latest

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test
        env:
          BEAVER_PATH: ${{ github.workspace }}/beaver
          BEAVER_KINDA_PATH: ${{ github.workspace }}/kinda
          LLVM_CONFIG_PATH: ${{ github.workspace }}/llvm-prebuilt/bin/llvm-config
