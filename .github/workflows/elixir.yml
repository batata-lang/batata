name: Elixir CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Mix package managers
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Test native dependency bootstrap
        working-directory: scripts/native_deps
        run: |
          mix format --check-formatted
          mix test --warnings-as-errors
          mix compile --warnings-as-errors

      - name: Configure pinned native dependencies
        working-directory: scripts/native_deps
        run: mix batata.native setup
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report native dependency identity
        working-directory: scripts/native_deps
        run: mix batata.native doctor

      - name: Check formatting
        working-directory: scripts/native_deps
        run: mix batata.native run -- format --check-formatted

      - name: Compile without warnings
        working-directory: scripts/native_deps
        run: mix batata.native compile --warnings-as-errors

      - name: Run Credo
        working-directory: scripts/native_deps
        run: mix batata.native run -- credo --strict

      - name: Run tests
        working-directory: scripts/native_deps
        run: mix batata.native test --warnings-as-errors --max-cases 1 --timeout 120000

      - name: Test Batata Godot package
        working-directory: scripts/native_deps
        run: |
          mix batata.native exec -- bash -c '
            cd packages/batata_godot
            export BATATA_PATH=../..
            mix deps.get
            mix format --check-formatted
            mix compile --warnings-as-errors
            mix credo --strict
            mix test --warnings-as-errors
          '

      - name: Upload concurrent runtime traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-runtime-traces
          path: _build/runtime_soak/*.json
          if-no-files-found: warn

      - name: Run fixed runtime soak gate
        working-directory: scripts/native_deps
        run: mix batata.native exec -- bash scripts/runtime-soak.sh _build/runtime_soak 1 0x6101

      - name: Upload runtime soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-soak-report
          path: _build/runtime_soak
          if-no-files-found: error

      - name: Checkout pinned Jason probe corpus
        uses: actions/checkout@v4
        with:
          repository: michalmuskala/jason
          ref: 4ede42858eb19f80ec9e863aab52df466eab8608
          path: jason-probe-source

      - name: Run Jason compile probe
        working-directory: scripts/native_deps
        run: |
          mix batata.native run -- batata.jason_probe \
            --source jason-probe-source \
            --output _build/jason_probe/report.json \
            --baseline probe/jason/baseline.json \
            --fail-on-regression

      - name: Upload Jason probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jason-probe-report
          path: _build/jason_probe/report.json
          if-no-files-found: error

      - name: Checkout pinned Decimal probe corpus
        uses: actions/checkout@v4
        with:
          repository: ericmj/decimal
          ref: 592d59ac4474933f91cdc3e8e037f137f7e008b0
          path: decimal-probe-source

      - name: Run Decimal compile probe
        working-directory: scripts/native_deps
        run: |
          mix batata.native run -- batata.decimal_probe \
            --source decimal-probe-source \
            --output _build/decimal_probe/report.json \
            --baseline probe/decimal/baseline.json

      - name: Run Jason and Decimal coverage dashboard
        working-directory: scripts/native_deps
        run: |
          mix batata.native run -- batata.coverage \
            --jason-source jason-probe-source \
            --decimal-source decimal-probe-source \
            --jason-raw-report _build/jason_probe/report.json \
            --decimal-raw-report _build/decimal_probe/report.json \
            --output _build/coverage/report.json \
            --fail-on-regression

      - name: Upload coverage dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-coverage-dashboard
          path: _build/coverage/report.json
          if-no-files-found: error

      - name: Upload Decimal probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decimal-probe-report
          path: _build/decimal_probe/report.json
          if-no-files-found: error

      - name: Run process-reuse benchmark
        working-directory: scripts/native_deps
        run: |
          mix batata.native exec -- bash -c '
            output="$(zig run -O ReleaseFast --dep runtime \
              -Mroot=bench/process_reuse.zig -Mruntime=native/term_runtime.zig -lc 2>&1)"
            echo "$output"
            echo "$output" | grep -q "\"reuse_success\": 1000000"
            echo "$output" | grep -q "\"reuse_last_index\": [0-9]"
            echo "$output" | grep -q "\"no_reuse_last_index\": 1000000"
          '

  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 27.3

      - name: Build Hex package without native overrides
        run: |
          mix local.hex --force
          mix deps.get
          env -u BEAVER_PATH -u BEAVER_KINDA_PATH -u LLVM_CONFIG_PATH mix hex.build
